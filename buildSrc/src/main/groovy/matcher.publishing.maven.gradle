plugins {
	id 'maven-publish'
}

publishing {
	publications {
		"$project.name"(MavenPublication) {
			groupId = 'com.github.Crafter-Y'
			from components.java
		}
	}

	repositories {
		def ENV = System.getenv()

		if (ENV.MAVEN_URL) {
			repositories.maven {
				name = "fabric"
				url = ENV.MAVEN_URL
				credentials {
					username = ENV.MAVEN_USERNAME
					password = ENV.MAVEN_PASSWORD
				}
			}
		}

		if (ENV.GITHUB_TOKEN) {
			repositories.maven {
				name = "GitHubPackages"
				url = "https://maven.pkg.github.com/${ENV.GITHUB_REPOSITORY ?: 'Crafter-Y/Matcher'}"
				credentials {
					username = ENV.GITHUB_ACTOR
					password = ENV.GITHUB_TOKEN
				}
			}
		}
	}
}
